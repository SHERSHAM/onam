<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
  <title>Name Reveal — MCAS</title>
  <meta name="description" content="MCAS Presents — Name Reveal Experience">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ===== Name Reveal Page Specific Styles ===== */
    .reveal-page-body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 30%, #161208 0%, #080704 50%, #000000 100%);
      color: #ffffff;
      font-family: 'Cinzel', 'Times New Roman', serif;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reveal-page-body.loaded {
      opacity: 1;
    }

    /* Ambient cinematic gold dust / lighting background glow */
    .ambient-glow {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(800px, 90vw);
      height: min(400px, 60vh);
      background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.02) 50%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header navigation / brand */
    .reveal-header {
      position: relative;
      z-index: 10;
      padding: clamp(1.5rem, 3vh, 3rem) clamp(1.5rem, 4vw, 4rem);
    }

    .back-link {
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      letter-spacing: 0.3em;
      color: rgba(212, 175, 55, 0.6);
      text-decoration: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .back-link:hover {
      color: rgba(245, 230, 184, 0.95);
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* Primary Hero Section */
    .reveal-hero-section {
      position: relative;
      z-index: 5;
      min-height: calc(100vh - 120px);
      min-height: calc(100dvh - 120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem clamp(1rem, 4vw, 3rem);
    }

    /* Foundation container ready for future content */
    .reveal-content-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Subtitle header */
    .reveal-tagline {
      font-weight: 500;
      font-size: clamp(0.7rem, 1.6vw, 1.1rem);
      letter-spacing: clamp(0.3em, 1.5vw, 0.6em);
      color: rgba(212, 175, 55, 0.7);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    /* Main page title placeholder */
    .reveal-main-title {
      font-weight: 800;
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      letter-spacing: clamp(0.15em, 1.5vw, 0.3em);
      line-height: 1.1;
      margin: 0 0 1.5rem 0;
      background: linear-gradient(
        180deg,
        #e8d5a3 0%,
        #c9a84c 25%,
        #f5e6b8 45%,
        #d4af37 65%,
        #8b6914 85%,
        #c9a84c 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.25)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
    }

    /* Subtle divider */
    .gold-divider {
      width: min(180px, 50%);
      height: 1px;
      margin: 1.5rem auto 2.5rem;
      background: linear-gradient(90deg, transparent 0%, rgba(212, 175, 55, 0.6) 50%, transparent 100%);
    }

    /* Section Slot Area */
    .reveal-slot-area {
      position: relative;
      width: 100%;
      padding: 1rem 0;
    }
  </style>
</head>
<body class="reveal-page-body bg-black text-white p-0 m-0">

  <!-- Ambient Light Glow -->
  <div class="ambient-glow"></div>

  <!-- Header / Navigation -->
  <header class="reveal-header d-flex justify-content-between align-items-center">
    <a href="../index.html" class="back-link">
      <span>&#8592;</span>
      <span>INTRO</span>
    </a>
  </header>

  <!-- Main Content Foundation -->
  <main class="reveal-hero-section">
    <div class="reveal-content-container">
      <p class="reveal-tagline">MCAS PRESENTS</p>
      <h1 class="reveal-main-title">NAME REVEAL</h1>
      <div class="gold-divider"></div>
      
      <!-- Content slot ready for sections, images, animations, and information -->
      <div id="revealSlot" class="reveal-slot-area">
        <!-- Ready for user provided content -->
      </div>
    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.body.classList.add('loaded');
      }, 50);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smooth Scroll Sequence Animation</title>
  <!-- Bootstrap 5.3.3 CSS Grid -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white p-0 m-0 overflow-x-hidden">
  <!-- Minimalist Preloader Screen -->
  <div id="loader" class="loader d-flex flex-column align-items-center justify-content-center position-fixed top-0 start-0 w-100 vh-100">
    <div class="loader-spinner"></div>
    <div class="loader-text mt-3" id="loaderText">0%</div>
    <div class="loader-bar-bg mt-2">
      <div class="loader-bar" id="loaderBar"></div>
    </div>
  </div>

  <!-- Fullscreen Bootstrap Responsive Grid Layout -->
  <main class="container-fluid p-0 scroll-container">
    <div class="row g-0 w-100 h-100">
      <!-- Fullscreen Grid Column for xs, sm, md, lg, xl, xxl breakpoints -->
      <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12 canvas-wrapper position-fixed top-0 start-0 w-100 vh-100 d-flex align-items-center justify-content-center p-0">
        <canvas id="animationCanvas" class="w-100 h-100"></canvas>
      </div>
    </div>
  </main>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

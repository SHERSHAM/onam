<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
  <title>MCAS Presents — Cinematic Scroll</title>
  <meta name="description" content="MCAS Presents — A premium cinematic scroll-driven intro animation">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white p-0 m-0">

  <!-- Preloader -->
  <div id="loader" class="loader d-flex flex-column align-items-center justify-content-center position-fixed top-0 start-0 w-100 vh-100">
    <div class="loader-spinner"></div>
    <div class="loader-text mt-3" id="loaderText">0%</div>
    <div class="loader-bar-bg mt-2">
      <div class="loader-bar" id="loaderBar"></div>
    </div>
  </div>

  <!-- Fullscreen Scroll Container -->
  <main class="container-fluid p-0 scroll-container">
    <div class="row g-0">
      <div class="col-12 p-0">
        <!-- Video background canvas -->
        <canvas id="animationCanvas"></canvas>

        <!-- Title Overlay — independent HTML/CSS layer above the video -->
        <div id="titleOverlay" class="title-overlay">
          <h1 id="titleMCAS" class="title-mcas">MCAS</h1>
          <p id="titlePresents" class="title-presents">PRESENTS</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
